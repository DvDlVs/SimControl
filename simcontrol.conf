# SimControl — steering assist (AMS2 / AC Evo / AC Rally / Project CARS 2)
# Edit this file while simcontrol is running; it reloads automatically.
# The GTK config app also writes this file.
# Keys in the terminal: a = assist on/off, p = passthrough, r = reload, q = quit

assist_enabled = 1
passthrough    = 0
grab           = 1
loop_hz        = 120
hud            = 1
use_filter     = 0
filter_setting = 0.5000
graph_selection = 1

# Leave empty to auto-pick the first gamepad. Substring, case-insensitive.
gamepad_name = 

# Empty = try /dev/shm/$pcars2$ then /$pcars2
shm_path = 

# AMS2 UDP (unused on this Proton build; SHM is the live path).
udp_port = 5606

# --- steering ---
steering_rate                = 0.1971
rate_increase_with_speed     = 0.0000
# Peak slip target in degrees (absolute).
target_slip_deg              = 5.0333
target_slip_scale            = 1.0000
self_steer_response          = 0.0135
damping_strength             = 1.0000
max_self_steer_angle         = 5.0000
countersteer_response        = 0.2500
# 0–10, dynamic steering limit units.
max_dynamic_limit_reduction  = 6.9697

# Assumed road-wheel lock (only used to normalise degree terms).
steering_lock_deg            = 20.0000
wheelbase_m                  = 2.6000

# Stick shaping (the game will not apply pad gamma to a virtual wheel).
stick_gamma                  = 1.4000
deadzone                     = 0.0000

# Flip if self-steer pushes INTO the slide, or left/right is reversed.
steer_sign = 1
yaw_sign   = 1
lat_sign   = 1
# -1 if HUD lim stays ~1.00 at speed (body Z points backward).
fwd_sign   = -1
swap_xz    = 0

invert_throttle = 0
invert_brake    = 0
